<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>Reset password | SFMS</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: #182a27;
      background: #f4f7f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --green: #126b57;
      --muted: #64746f;
      --line: #d8e2dd;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        linear-gradient(135deg, rgba(18, 107, 87, .045) 25%, transparent 25%) 0 0 / 24px 24px,
        #f4f7f5;
    }

    main {
      width: min(100%, 440px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 34px;
      box-shadow: 0 18px 55px rgba(25, 55, 45, .08);
    }

    .brand {
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 { margin: 28px 0 8px; font-size: 28px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    form { display: grid; gap: 16px; margin-top: 26px; }
    label { display: grid; gap: 7px; color: #344640; font-size: 14px; font-weight: 600; }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #becdc6;
      border-radius: 5px;
      padding: 10px 12px;
      color: #182a27;
      font: inherit;
    }

    input:focus { outline: 3px solid rgba(18, 107, 87, .16); border-color: var(--green); }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 5px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { cursor: wait; opacity: .65; }
    #notice { margin-top: 18px; font-size: 14px; }
    #notice[data-kind="error"] { color: #a53030; }
    #notice[data-kind="success"] { color: var(--green); }
    .hint { margin-top: 20px; border-top: 1px solid #e7ede9; padding-top: 15px; font-size: 12px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      main { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">SFMS / Account security</div>
    <h1 id="heading">Reset your password</h1>
    <p id="description">Choose a new password for your SFMS account.</p>

    <form id="reset-form" hidden>
      <label for="password">New password
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label for="confirm-password">Confirm new password
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button id="submit" type="submit">Save new password</button>
    </form>

    <p id="notice" role="status" aria-live="polite">Checking your recovery link...</p>
    <p class="hint">Use at least 8 characters. After changing it, return to the SFMS app and sign in with your new password.</p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://iehuzsmrtxhfjofhrcuw.supabase.co",
      "sb_publishable_pzz32iazeCj0vVKifS0DHw_pUweAqwi"
    );
    const form = document.querySelector("#reset-form");
    const notice = document.querySelector("#notice");
    const button = document.querySelector("#submit");
    const heading = document.querySelector("#heading");
    const description = document.querySelector("#description");
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const recoveryLink = hash.get("type") === "recovery" || new URLSearchParams(window.location.search).get("type") === "recovery";

    function setNotice(message, kind = "info") {
      notice.textContent = message;
      notice.dataset.kind = kind;
    }

    function showForm() {
      form.hidden = false;
      notice.textContent = "Your recovery link is verified. Set a new password below.";
      notice.dataset.kind = "success";
    }

    async function startRecovery() {
      const params = new URLSearchParams(window.location.search);
      const authError = params.get("error_description") || params.get("error");
      if (authError) {
        throw new Error(decodeURIComponent(authError.replaceAll("+", " ")));
      }

      const code = params.get("code");
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;
      }

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (recoveryLink && data.session) {
        showForm();
        return;
      }

      heading.textContent = "Recovery link unavailable";
      description.textContent = "This link may have expired or already been used.";
      setNotice("Request a new password recovery email, then open its newest link on this device.", "error");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#password").value;
      const confirmation = document.querySelector("#confirm-password").value;

      if (password.length < 8) {
        setNotice("Use a password with at least 8 characters.", "error");
        return;
      }
      if (password !== confirmation) {
        setNotice("The passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        await supabase.auth.signOut();
        form.hidden = true;
        heading.textContent = "Password updated";
        description.textContent = "Your existing SFMS account is ready to use with the new password.";
        setNotice("Return to the SFMS app and sign in with your new password.", "success");
      } catch (error) {
        setNotice(error.message || "We couldn't update your password. Request a new recovery link and try again.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Save new password";
      }
    });

    startRecovery().catch((error) => {
      heading.textContent = "Recovery link unavailable";
      description.textContent = "This link could not be verified.";
      setNotice(error.message || "Request a new recovery email and try again.", "error");
    });
  </script>
</body>
</html>
